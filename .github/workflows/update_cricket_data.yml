name: Weekly Cricsheet Data Sync & Optimization

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download / Update Latest Cricsheet Dataset
        run: |
          python parse_cricsheet_csv.py

      - name: Run Feature Engineering & Market Engine
        run: |
          python pipeline_market_engine.py

      - name: Run Production Optimizer Test
        run: |
          python pipeline_optimizer_production.py

      - name: Commit Updated Master Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_cricket_dataset.csv batter_features.csv bowler_features.csv unified_player_projections.csv
          git commit -m "chore: automated weekly cricsheet data refresh and feature update" || echo "No changes to commit"
          git push
